modLoader = "javafml"
loaderVersion = "*"
issueTrackerURL = "https://github.com/Syconn/Color-Accurate-Maps/issues"
license = "MPL-2.0"

[[mods]]
modId = "${id}"
version = "${version}"
displayName = "${name}"
authors = "Syconn"
description = '''
${description}
'''
logoFile = "icon.png"

[[dependencies.${id}]]
modId = "minecraft"
mandatory = true
versionRange = "[${minecraftVersion},)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${id}]]
modId = "forge"
mandatory = true
versionRange = "*"
ordering = "NONE"
side = "CLIENT"
